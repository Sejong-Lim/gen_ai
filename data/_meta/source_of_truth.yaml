# -----------------------------------------------------------------------------
# 6. 알람 코드 (Alarm Code Master) — 40 codes
#    - section_id 는 alarm_code_guide.md 의 anchor 와 일치한다.
#    - related_sop_id 가 null 이면 alarm_code_guide 내에서 단독 설명.
#    - has_documented_action=false 인 코드는 의도적 KB 결함(edge case).
# -----------------------------------------------------------------------------
alarm_codes:
  # ---- TEMP (5) ----
  - code: TEMP-C-001
    section_id: AC-TEMP-C-001
    name: 챔버 과열 Critical
    category: TEMP
    severity: C
    threshold_text: "챔버 온도 > recipe setpoint + 50°C 또는 절대값 380°C 초과"
    typical_causes: ["냉각수 차단", "히터 단락", "센서 오결선"]
    applicable_eq_types: [CVD, DRY, FUR, RTP]
    related_sop_id: SOP-TEMP-001
