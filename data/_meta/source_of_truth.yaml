    summary: "Critical 5분, High 15분, Medium 4시간, Warning 24시간 응답 목표."
  - section_id: POL-ESC-001
    title: 내부 Escalation 절차
    summary: "1차 EQ_ENG → 2차 팀장 → 3차 공정 PM."
  - section_id: POL-ESC-002
    title: 벤더 Escalation 절차
    summary: "내부 SOP로 해결 불가 시 벤더 기술지원 티켓 발행 — KB 밖 질의의 표준 응답 경로."
  - section_id: POL-CHG-001
    title: 임계치 변경 신청 절차
    summary: "신청서 양식 / 검토자 / 승인 단계 / 적용 후 모니터링 의무."
  - section_id: POL-DATA-001
    title: 데이터 보존 정책
    summary: "Trend 원본 90일, 알람 이력 2년, VOC 이력 5년."
  - section_id: POL-ACC-001
    title: 시스템 접근 권한 신청
    summary: "신규 사용자 등록, 권한 변경 절차."
  - section_id: POL-NIGHT-001
    title: 야간/주말 비상 대응 정책
    summary: "정규시간 외 Critical 알람 발생 시 호출 트리 — SOP-ESC-002 연계."
  - section_id: POL-SCOPE-001
    title: 지식베이스 범위 (Out-of-Scope 명시)
    summary: "본 시스템 KB가 다루지 않는 영역(벤더 내부 파라미터, 보안 운영, 인사) 명시."

