# =============================================================================
# FDC-Monitoring AI System — Source of Truth
# -----------------------------------------------------------------------------
# 본 파일은 모든 매뉴얼/DB/VOC/평가셋의 단일 진실 공급원(Single Source of Truth)이다.
# - 모든 ID, 명명 규칙, 관계 매핑이 여기서 결정된다.
# - 매뉴얼·VOC·평가셋의 citation은 본 파일에 정의된 section_id를 참조해야 한다.
# - scripts/build_db.py 와 scripts/validate_integrity.py 가 이 파일을 읽는다.
# =============================================================================

meta:
  system_name: "FDC-Monitoring AI System"
  version: "1.0.0"
  generated_for: "VOC Response Agent — 3-day demo"
  generation_seed: 20260515
  current_date: "2026-05-15"

# -----------------------------------------------------------------------------
# 1. 공정 (Process)
# -----------------------------------------------------------------------------
processes:
  - id: THIN
    name: 박막증착
    description: CVD/PVD를 통한 박막 형성 공정
  - id: PHOTO
    name: 포토
    description: 노광/현상을 통한 패턴 형성
  - id: ETCH
    name: 식각
    description: 노광 패턴에 따른 박막 제거
  - id: DIFF
    name: 확산
    description: 열처리를 통한 도펀트 확산/산화
  - id: IMP
    name: 이온주입
    description: 이온 가속을 통한 도핑
  - id: CMP
    name: 화학기계연마
    description: 웨이퍼 표면 평탄화
  - id: CLN
    name: 세정
    description: 웨이퍼 세정/스트립
  - id: MTL
    name: 계측/검사
    description: 박막두께/CD/결함 검사

# -----------------------------------------------------------------------------
# 2. 설비 타입 (Equipment Type)
#    - capabilities: 해당 설비에서 발생 가능한 알람 카테고리
# -----------------------------------------------------------------------------
equipment_types:
  - id: CVD
    process: THIN
    full_name: "PECVD/LPCVD Chamber"
    capabilities: [TEMP, PRES, FLOW, RF, VAC, GAS, COMM, REC, MECH]
  - id: PVD
    process: THIN
    full_name: "Sputter/PVD Chamber"
    capabilities: [PRES, RF, VAC, HV, COMM, REC, MECH]
  - id: DRY
    process: ETCH
    full_name: "Dry Etcher (RIE/ICP)"
    capabilities: [TEMP, PRES, FLOW, RF, VAC, GAS, COMM, REC, MECH]
  - id: WET
    process: ETCH
    full_name: "Wet Etch/Cleaner Bench"
    capabilities: [CHEM, COMM, REC, MECH]
  - id: SCN
    process: PHOTO
    full_name: "Lithography Scanner"
    capabilities: [COMM, REC, MECH]
  - id: CTR
    process: PHOTO
    full_name: "Coater/Developer Track"
    capabilities: [TEMP, CHEM, COMM, REC, MECH]
  - id: FUR
    process: DIFF
    full_name: "Vertical/Horizontal Furnace"
    capabilities: [TEMP, GAS, COMM, REC, MECH]
  - id: RTP
    process: DIFF
    full_name: "Rapid Thermal Processor"
    capabilities: [TEMP, GAS, COMM, REC, MECH]
  - id: HCI
    process: IMP
    full_name: "High Current Implanter"
    capabilities: [VAC, HV, DOSE, COMM, REC, MECH]
  - id: MCI
    process: IMP
    full_name: "Medium Current Implanter"
    capabilities: [VAC, HV, DOSE, COMM, REC, MECH]
  - id: POL
    process: CMP
    full_name: "CMP Polisher"
    capabilities: [CHEM, COMM, REC, MECH]
  - id: CLN
    process: CLN
    full_name: "Wet Cleaner"
    capabilities: [CHEM, COMM, REC, MECH]
  - id: MES
    process: MTL
    full_name: "Thickness/CD Measurement"
    capabilities: [COMM, REC, MECH]
  - id: INS
    process: MTL
    full_name: "Defect/Overlay Inspector"
    capabilities: [COMM, REC, MECH]

# -----------------------------------------------------------------------------
# 3. 심각도 (Severity)
# -----------------------------------------------------------------------------
severities:
  - id: C
    name: Critical
    response_time_min: 5
    escalation_required: true
    auto_stop_equipment: true
    description: 즉시 설비 정지 및 escalation. EHS 영향 가능.
  - id: H
    name: High
    response_time_min: 15
    escalation_required: false
    auto_stop_equipment: true
    description: 설비 자동 hold. 운영 엔지니어 1차 대응.
  - id: M
    name: Medium
    response_time_min: 60
    escalation_required: false
    auto_stop_equipment: false
    description: 진행은 계속, 다음 lot 시작 전 확인 권장.
  - id: W
    name: Warning
    response_time_min: 240
    escalation_required: false
    auto_stop_equipment: false
    description: 경고성 표시. 추이 모니터링 권장.
  - id: I
    name: Info
    response_time_min: null
    escalation_required: false
    auto_stop_equipment: false
    description: 정보성 이벤트. 조치 불필요.

# -----------------------------------------------------------------------------
# 4. 알람 카테고리 (Alarm Category)
# -----------------------------------------------------------------------------
alarm_categories:
  - id: TEMP
    name: 온도
    applies_to_eq_types: [CVD, DRY, CTR, FUR, RTP]
  - id: PRES
    name: 압력
    applies_to_eq_types: [CVD, PVD, DRY]
  - id: FLOW
    name: 가스유량
    applies_to_eq_types: [CVD, DRY, FUR]
  - id: RF
    name: RF
    applies_to_eq_types: [CVD, PVD, DRY]
  - id: VAC
    name: 진공
    applies_to_eq_types: [CVD, PVD, DRY, HCI, MCI]
  - id: GAS
    name: 가스(누설/잔량)
    applies_to_eq_types: [CVD, DRY, FUR, RTP]
  - id: HV
    name: 고전압
    applies_to_eq_types: [PVD, HCI, MCI]
  - id: DOSE
    name: Dose
    applies_to_eq_types: [HCI, MCI]
  - id: CHEM
    name: 케미컬
    applies_to_eq_types: [WET, CTR, POL, CLN]
  - id: COMM
    name: 통신
    applies_to_eq_types: [CVD, PVD, DRY, WET, SCN, CTR, FUR, RTP, HCI, MCI, POL, CLN, MES, INS]
  - id: REC
    name: Recipe
    applies_to_eq_types: [CVD, PVD, DRY, WET, SCN, CTR, FUR, RTP, HCI, MCI, POL, CLN, MES, INS]
  - id: MECH
    name: 기계동작
    applies_to_eq_types: [CVD, PVD, DRY, WET, SCN, CTR, FUR, RTP, HCI, MCI, POL, CLN, MES, INS]

# -----------------------------------------------------------------------------
