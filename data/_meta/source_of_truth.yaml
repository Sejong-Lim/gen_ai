# 12. 파생 산출물 명세 (build_db.py 가 사용)
# -----------------------------------------------------------------------------
derivation:
  alarm_history:
    target_rows: 500
    date_range: ["2026-02-15", "2026-05-15"]
    hotspot_equipment: [THIN-CVD-02, ETCH-DRY-03, DIFF-FUR-02]
    severity_distribution: {C: 0.05, H: 0.20, M: 0.30, W: 0.40, I: 0.05}
  voc_history:
    target_rows: 150
    date_range: ["2026-02-15", "2026-05-10"]
    status_distribution: {OPEN: 0.10, IN_PROGRESS: 0.20, RESOLVED: 0.65, CLOSED: 0.05}
