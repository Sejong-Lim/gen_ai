#    - section_id 는 troubleshooting_guide.md 의 anchor 와 일치한다.
# -----------------------------------------------------------------------------
sops:
  - id: SOP-TEMP-001
    section_id: SOP-TEMP-001
    title: 챔버 과열 대응
    related_alarm_codes: [TEMP-C-001, TEMP-H-001]
