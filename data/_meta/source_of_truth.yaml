  - code: TEMP-M-001
    section_id: AC-TEMP-M-001
    name: 가열 속도 이상
    category: TEMP
    severity: M
    threshold_text: "ramp rate가 recipe 대비 ±15% 초과 편차"
    typical_causes: ["히터 출력 저하", "TC 응답 지연"]
    applicable_eq_types: [CVD, FUR, RTP, CTR]
    related_sop_id: SOP-TEMP-002
    has_documented_action: true
  - code: TEMP-W-001
    section_id: AC-TEMP-W-001
    name: 챔버 저온 Warning
    category: TEMP
    severity: W
    threshold_text: "Idle 상태 챔버 온도 < setpoint - 10°C"
