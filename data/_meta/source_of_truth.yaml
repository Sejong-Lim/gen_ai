    section_id: AC-PRES-C-001
    name: 챔버 압력 Critical
    category: PRES
    severity: C
    threshold_text: "process pressure가 setpoint 대비 ±30% 초과"
    typical_causes: ["TM 밸브 고착", "펌프 정지", "MFC 폭주"]
    applicable_eq_types: [CVD, PVD, DRY]
    related_sop_id: SOP-PRES-001
    has_documented_action: true
  - code: PRES-H-001
    section_id: AC-PRES-H-001
    name: 챔버 압력 High
    category: PRES
    severity: H
    threshold_text: "process pressure가 setpoint 대비 +15% 초과"
    typical_causes: ["배기 throttle 동작 불량", "가스 과주입"]
    applicable_eq_types: [CVD, PVD, DRY]
    related_sop_id: SOP-PRES-001
    has_documented_action: true
  - code: PRES-M-001
    section_id: AC-PRES-M-001
    name: 압력 변동 이상
    category: PRES
    severity: M
    threshold_text: "30초 이동표준편차 > setpoint × 5%"
    typical_causes: ["가스 라인 진동", "throttle 미세진동"]
    applicable_eq_types: [CVD, PVD, DRY]
    related_sop_id: SOP-PRES-001
