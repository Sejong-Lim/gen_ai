    applicable_eq_types: [CVD, PVD, DRY, HCI, MCI]
    related_sop_id: SOP-VAC-001
    has_documented_action: true
  - code: VAC-H-001
    section_id: AC-VAC-H-001
    name: 진공도 미달 High
    category: VAC
    severity: H
    threshold_text: "base pressure > 5e-6 Torr (목표 1e-6 Torr)"
