# =============================================================================
# Root Cause Tags — 마스터 분류 체계
# -----------------------------------------------------------------------------
# 본 파일은 source_of_truth.yaml 의 alarm_codes / sops 에서 사용되는
# `root_cause_tags` 의 단일 진실 공급원이다.
#
# 규칙:
#   - 모든 tag 는 snake_case (ASCII) 로 작성한다.
#   - 동의어/유사 표현은 한 tag 로 통합하여 임베딩 분기를 막는다.
#   - validate_integrity.py [G2] 가 본 파일의 id 집합과 SOT 사용처를 대조하며
#     마스터에 없는 tag 사용 시 FAIL.
#
# 카테고리: thermal | vacuum | pressure | flow | gas | rf | hv | dose
#           | chem | comm | recipe | mech | sensor
# =============================================================================

